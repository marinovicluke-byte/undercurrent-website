<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default meta (home page) — overridden per route via React Helmet or inline script -->
    <title>UnderCurrent — AI Business Automation</title>
    <meta name="description" content="Melbourne-based AI automation studio. We map small business workflows and build custom AI-powered systems that run your operations — silently, continuously, precisely." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1C1C1A" />
    <link rel="canonical" href="https://www.undercurrentautomations.com/" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable site index" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.undercurrentautomations.com/" />
    <meta property="og:title" content="UnderCurrent — AI Business Automation" />
    <meta property="og:description" content="Melbourne-based AI automation studio. We map small business workflows and build custom AI-powered systems that run your operations — silently, continuously, precisely." />
    <meta property="og:image" content="https://www.undercurrentautomations.com/og-image.jpg" />
    <meta property="og:site_name" content="UnderCurrent" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UnderCurrent — AI Business Automation" />
    <meta name="twitter:description" content="Melbourne-based AI automation studio. We map small business workflows and build custom AI-powered systems that run your operations — silently, continuously, precisely." />
    <meta name="twitter:image" content="https://www.undercurrentautomations.com/og-image.jpg" />

    <!-- Structured Data: LocalBusiness + WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["LocalBusiness", "Organization"],
          "@id": "https://www.undercurrentautomations.com/#business",
          "name": "UnderCurrent",
          "alternateName": "UnderCurrent AI Automation",
          "description": "Melbourne-based AI automation studio specialising in workflow automation for small businesses — onboarding, customer experience, sales, content design, and personal assistant AI systems.",
          "url": "https://www.undercurrentautomations.com",
          "logo": "https://www.undercurrentautomations.com/favicon.svg",
          "image": "https://www.undercurrentautomations.com/og-image.jpg",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Melbourne",
            "addressRegion": "VIC",
            "addressCountry": "AU"
          },
          "areaServed": {
            "@type": "Country",
            "name": "Australia"
          },
          "serviceType": [
            "AI Business Automation",
            "Workflow Automation",
            "Business Process Automation",
            "AI Agent Deployment"
          ],
          "telephone": "+61438780815",
          "email": "luke@undercurrentautomations.com",
          "priceRange": "$500–$20,000",
          "openingHoursSpecification": {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
            "opens": "09:00",
            "closes": "17:00"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": -37.8136,
            "longitude": 144.9631
          },
          "sameAs": [
            "https://www.instagram.com/undercurrent.automations/",
            "https://www.facebook.com/profile.php?id=61578553167947",
            "https://www.linkedin.com/company/undercurrent-automations"
          ],
          "foundingDate": "2026",
          "knowsAbout": [
            "AI automation",
            "workflow design",
            "CRM integration",
            "small business operations",
            "sales automation",
            "customer experience automation"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.undercurrentautomations.com/#website",
          "url": "https://www.undercurrentautomations.com",
          "name": "UnderCurrent",
          "publisher": { "@id": "https://www.undercurrentautomations.com/#business" }
        }
      ]
    }
    </script>

    <!-- Preload hero video -->
    <link rel="preload" as="video" href="/hero-bg.mp4" type="video/mp4" />

    <!-- DNS prefetch + preconnect for fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&family=Outfit:wght@800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&family=Outfit:wght@800&display=swap" rel="stylesheet" />
    <!-- Prevent blank flash before JS loads -->
    <style>
      html, body { margin: 0; padding: 0; background: #F7F3ED; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
